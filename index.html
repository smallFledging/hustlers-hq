<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script defer src="./js/layout-loader.js"></script>
    <script defer type="module" src="./js/script.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <title>Recipe finder</title>
  </head>
  <body>
    <div class="wrapper">
      <header class="header">
        <div class="header__container">
          <!-- Zeinab -->
        </div>
      </header>
      <main class="main">
        <div class="main__container">
          <!-- Zeinab carousel -->
         <section class="main__swiper">
            <div class="swiper mySwiper">
    <div class="swiper-wrapper">
      <div class="swiper-slide"><img src="./img/meal-0.webp" alt="meal"></div>
      <div class="swiper-slide"><img src="./img/meal-1.avif" alt="meal"></div>
      <div class="swiper-slide"><img src="./img/meal-2.jpeg" alt="meal"></div>
      <div class="swiper-slide"><img src="./img/meal-3.webp" alt="meal"></div>
      <div class="swiper-slide"><img src="./img/meal-4.jpeg" alt="meal"></div>
      <div class="swiper-slide"><img src="./img/meal-5.jpg" alt="meal"></div>
      <div class="swiper-slide"><img src="./img/meal-6.jpg" alt="meal"></div>
    </div>
    <div class="swiper-button-next"></div>
    <div class="swiper-button-prev"></div>
    <div class="swiper-pagination"></div>
  </div>
         </section>
          <!-- Daria text content -->
          <section class="main__content">
            <h1 class="main__title">Find Your Next Favorite Meal</h1>
            <p class="main__text">
              Discover delicious recipes from around the world. Search by
              ingredient, explore categories, and get inspired to cook something
              new today!
            </p>
          </section>
          <!-- Daria block btn serch or random -->
          <section class="main__random-meal random-meal-block">
            <div class="random-meal-block__btns">
              <a href="./recipes.html"
                ><button class="random-meal-block__link">
                  Search for the meal
                </button></a
              >
              <p class="random-meal-block__text">or</p>
              <button id="random-meal" class="random-meal-block__link">
                Get random
              </button>
            </div>
            <a href="#">
              <div class="random-meal-block__card">
                <img class="random-meal-block__img" src="#" alt="meal" />
                <h3 class="random-meal-block__title">title</h3>
              </div>
            </a>
          </section>
        </div>
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- Initialize Swiper -->
    <script>
      var swiper = new Swiper(".mySwiper", {
        effect: 'fade',
        spaceBetween: 30,
        centeredSlides: true,
        loop: true,
        autoplay: {
          delay: 2500,
          disableOnInteraction: false,
        },
        pagination: {
          el: ".swiper-pagination",
          clickable: true,
        },
        navigation: {
          nextEl: ".swiper-button-next",
          prevEl: ".swiper-button-prev",
        },
      });
    </script>
  </body>
</html>
